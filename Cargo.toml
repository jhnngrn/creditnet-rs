[package]
name = "creditnet"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "creditnet"
path = "src/main.rs"

[dependencies]
mimesis = { path = "../mimesis-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1"] }
http-body-util = "0.1"
